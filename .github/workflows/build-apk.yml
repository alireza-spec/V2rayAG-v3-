name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: arm64
            abi: arm64-v8a
          - label: armeabi
            abi: armeabi-v7a
          - label: universal
            abi: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android project
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Configure ABI split
        if: matrix.abi != ''
        working-directory: android
        env:
          TARGET_ABI: ${{ matrix.abi }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path('app/build.gradle')
          if not path.exists():
              raise SystemExit('android/app/build.gradle was not generated')

          content = path.read_text()
          abi = os.environ['TARGET_ABI']
          block = f'''\n    splits {{\n        abi {{\n            enable true\n            reset()\n            include "{abi}"\n            universalApk false\n        }}\n    }}\n'''

          if 'splits {' not in content:
              content = content.replace('android {', 'android {' + block, 1)
              path.write_text(content)
          PY

      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        env:
          VERSION: ${{ github.ref_name }}
          LABEL: ${{ matrix.label }}
        run: |
          set -e
          OUTPUT="V2rayAG-${LABEL}-${VERSION}.apk"
          APK=$(find android/app/build/outputs/apk/debug -type f -name '*.apk' | sort | head -n 1)
          if [ -z "$APK" ]; then
            echo "No debug APK was generated"
            find android/app/build/outputs -type f || true
            exit 1
          fi
          cp "$APK" "$OUTPUT"
          ls -lh "$OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: V2rayAG-${{ matrix.label }}
          path: V2rayAG-${{ matrix.label }}-*.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List APK files
        run: find artifacts -type f -name '*.apk' -exec ls -lh {} \;

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: V2rayAG ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## V2rayAG Dashboard APK

            نسخه مناسب پردازنده گوشی خود را دانلود کنید.

            - **arm64**: گوشی‌های جدید ۶۴ بیتی
            - **armeabi**: گوشی‌های قدیمی ۳۲ بیتی
            - **universal**: سازگار با همه گوشی‌ها، با حجم بیشتر

            اگر نوع پردازنده را نمی‌دانید، نسخه **universal** را نصب کنید.
          files: artifacts/*.apk
          draft: false
          prerelease: false
