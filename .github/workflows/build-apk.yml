name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - target: arm64-v8a
            arch: arm64
            abi: arm64-v8a
            label: arm64
          - target: armeabi-v7a
            arch: arm
            abi: armeabi-v7a
            label: armeabi
          - target: universal
            arch: ''
            abi: ''
            label: universal

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor CLI
        run: npm install -D @capacitor/cli @capacitor/core @capacitor/android

      - name: Add Android platform
        run: npx cap add android || true

      - name: Sync web assets
        run: npx cap sync android

      - name: Configure ABI splits
        working-directory: android
        run: |
          sed -i '/android {/a\
            splits {\
              abi {\
                enable true\
                reset()\
                include "'"${{ matrix.abi }}"'"\
                universalApk false\
              }\
            }' app/build.gradle
        if: matrix.target != 'universal'

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Rename APK
        run: |
          VERSION="${{ github.ref_name || 'latest' }}"
          SIGNED_FILE="${{ steps.sign_app.outputs.signedReleaseFile }}"
          if [ -f "$SIGNED_FILE" ]; then
            cp "$SIGNED_FILE" "V2rayAG-${{ matrix.label }}-${VERSION}.apk"
          else
            echo "Signed file not found, listing release dir:"
            find android/app/build/outputs/apk/release -name "*.apk" || true
            cp android/app/build/outputs/apk/release/*.apk "V2rayAG-${{ matrix.label }}-${VERSION}.apk"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: V2rayAG-${{ matrix.label }}
          path: V2rayAG-${{ matrix.label }}-*.apk

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -name "*.apk" -exec ls -lh {} \;

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: V2rayAG ${{ github.ref_name || 'v1.0.0' }}
          body: |
            ## V2rayAG Dashboard APK

            دانلود و نصب فایل APK مناسب پردازنده گوشی خود را انتخاب کنید.

            ### نسخه‌ها:
            - **arm64** — پردازنده‌های ۶۴بیتی (اکثر گوشی‌های جدید)
            - **armeabi** — پردازنده‌های ۳۲بیتی (گوشی‌های قدیمی‌تر)
            - **universal** — سازگار با همه پردازنده‌ها (حجم بیشتر)

            ### راهنمای نصب:
            ۱. فایل APK مناسب گوشی خود را دانلود کنید
            ۲. در تنظیمات اندروید «نصب از منابع ناشناخته» را فعال کنید
            ۳. فایل را باز و نصب کنید

            > اگر نمی‌دانید کدام نسخه را دانلود کنید، نسخه **universal** را انتخاب کنید.
          files: |
            artifacts/*/V2rayAG-*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
