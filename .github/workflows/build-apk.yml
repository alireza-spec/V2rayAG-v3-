name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -e
          OUTPUT="V2rayAG-${VERSION}.apk"
          APK=$(find android/app/build/outputs/apk/debug -type f -name '*.apk' | sort | head -n 1)
          if [ -z "$APK" ]; then
            echo "No debug APK was generated"
            find android/app/build/outputs -type f || true
            exit 1
          fi
          cp "$APK" "$OUTPUT"
          ls -lh "$OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: V2rayAG-APK
          path: V2rayAG-*.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List APK files
        run: find artifacts -type f -name '*.apk' -exec ls -lh {} \;

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: V2rayAG ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## V2rayAG Dashboard APK

            این نسخه به صورت universal منتشر شده و روی همه گوشی‌ها نصب می‌شود.
          files: artifacts/*.apk
          draft: false
          prerelease: false
